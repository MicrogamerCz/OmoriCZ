name: prepare-mod-update
run-name: Create new translation release
on:
  push:
    branches:
      - main
      - feat/pipeline
jobs:
  bundle-mod-update:
    runs-on: ubuntu-slim
    steps:
      - name: Fetch repository
        uses: actions/checkout@v7
        with:
          path: omoricz
          sparse-checkout: |
            /*
            !/**/.*
          sparse-checkout-cone-mode: false
      - run: rm -r omoricz/.git
      - name: Create artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmoriCz
          path: omoricz/
          retention-days: 1
