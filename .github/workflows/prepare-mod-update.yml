name: prepare-mod-update
run-name: Create new translation release
on:
  push:
    branches:
      - main
jobs:
  bundle-mod-update:
    runs-on: ubuntu-slim
    steps:
      - name: Fetch repository
        uses: actions/checkout@v7
        with:
          path: omoricz
      - name: Remove unused files and create archive
        run: rm -r omoricz/.*
      - name: Create Archive
        working-directory: omoricz
        run: zip -r ../OmoriCz.zip .
      - name: Release
        uses: cssnr/upload-release-action@v1
        with:
          latest: true
          overwrite: true
          files: OmoriCz.zip
