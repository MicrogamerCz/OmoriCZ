#Talking to JOY

message_1:
      text: \n<HOLČIČKA>A-ahoj, zdravím, pane doučující...

#Talk to Joy / Cutscene: Joy Leaves

message_2:
      text: \n<HOLČIČKA>Mmmm...\! Promiňte...\! Tohle možná bude znít trochu sobecky, ale...

message_3:
      text: \n<HOLČIČKA>Víte, táta zrovna dneska není doma a...\! Učím se tady celé léto a ráda bych se aspoň na jeden den podívala do parku.

message_4:
      text: \n<HOLČIČKA>Mohl byste za mě dodělat ten list tak, aby na to nepřišel?\! Slibuji, že se vrátím, než se setmí, jen mu prosím nic neříkejte.

# yes /no

#if yes


message_5:
      text: \n<HOLČIČKA>Jé...\! Já věděla, že mi s tím pomůžete...

message_6:
      text: \n<HOLČIČKA>P-Počkat...\! Takže vy mě fakt pustíte ven?\!<br>Děkuji, pane doučující! Jste nejlepší!

message_8:
      text: \n<HOLČIČKA>Jupí! Já fakt půjdu do parku!\! Co bych tak asi měla udělat jako první...\! Už vím!\! Půjdu si hrát na pískoviště!\!<br>\sinv[1]Hehe... Už se nemůžu dočkat!

message_9:
      text: \n<HOLČIČKA>Ještě jednou děkuji, pane!\! To bude ale sranda!

#JOY runs out.

#if no

message_10:
      text: \n<HOLČIČKA>Aha...\! To se dalo čekat...\! Tak nevadí!\!<br>Stejně bych se asi měla více učit.

message_1000:
      text: \n<HOLČIČKA>Tak zase další den učení...\!<br>Uff... To by mě zajímalo, co zrovna dělá můj bráška...

