#Examine and take language Tutor Flyer:

message_0:
      text: Na zdi visí nabídka brigády.\! Přečteš si ji?

#Yes/No

#Yes

message_1:
      text: \"SHÁNÍME POMOC S DOUČOVÁNÍM!\! Hledám znalce českého jazyka na doučování mé dcery, JOY!\! Nabízím 20,00 Kč na den!\! V případě zájmu přineste ke mně na krátký pohovor!”

message_2:
      text: Chceš strhnout \c[4]MODRÝ LETÁK\c[0] ze stěny?

#Yes/No

#Yes
message_3:
      text: Na zadní straně je nakreslena cesta k domu.
#Show map

#Examine Joy's House Door

message_4:
      text: \n<HUSTÉ OBOČÍ>Dobrý den!\! Co pro vás mohu udělat?

message_100:
      text: Předal jsi \c[4]MODRÝ LETÁK\c[0] HUSTÉMU OBOČÍ.

message_101:
      text: \n<HUSTÉ OBOČÍ>Ach ano, vy budete asi JOYINI noví doučující!

message_5:
      text: \n<HUSTÉ OBOČÍ>Hmm...\! Na pohovor není čas!\! <br>Vy snad zvládáte učivo druhé třídy, ne?

message_7:
      text: \n<HUSTÉ OBOČÍ>Pospěšte si dovnitř!\! Moje dcera JOY na vás už čeká ve svém pokoji!

#Talk to Joy

message_8:
      text: \n<HOLČIČKA>A-Ahoj... Jmenuji se JOY. Ráda vás poznávám!\!<br>Vy budete ti moji noví doučující.\! Začneme hned?

message_9:
      text: \n<HOLČIČKA>Tak tohle je ten pracovní list, na kterém jsem se zasekla...

#Language worksheet

message_10:
      text: \n<HOLČIČKA>Tohle je cvičení mi dělá celkem problém...

message_11:
      text: Ve větě "Moje tužka někde leží." je slovo "Moje"

message_12:
      text: A) Příslovce

message_13:
      text: B) Podstatné jméno

message_14:
      text: C) Přídavné jméno

message_15:
      text: \n<HOLČIČKA>Zkusíme další...

message_16:
      text: Ve větě "Základem každé oslavy je výtečný dort" je slovo "Základem"

message_17:
      text: A) Ve 3. pádě

message_18:
      text: B) V 7. pádě

message_19:
      text: C) V 6. pádě

message_20:
      text: \n<HOLČIČKA>Tak něco trochu těžšího...

message_21:
      text: Která z těchto vět je napsána bez chyby?

message_22:
      text: A) Lilek chutná nejlépe, když jsou uvařené.

message_23:
      text: B) Je rozhodně nejchutnější než tofu.

message_24:
      text: C) Myslím, že lilek je lepší zelenina než to druhé.

#Correct choice:

message_25:
      text: \n<HOLČIČKA>Aha, dobře!\! Už to chápu!

#Incorrect choice:

message_26:
      text: \n<HOLČIČKA>Počkat...\! Já myslela, že je správně "A"?

message_27:
      text: \n<HOLČIČKA>Hmm...\! Ale...\! Není správná odpověď "B"?

message_28:
      text: \n<HOLČIČKA>Hmm...\! Počkat...\! Není správná odpověď "C"?

message_29:
      text: \n<HOLČIČKA>Aha, už tomu rozumím!\! Vy mě snad zkoušíte...

message_30:
      text: \n<HOLČIČKA>Promiňte, nikdy jsem doučování neměla, nevím, jak to chodí!

#After Completing Language Worksheet:

message_31:
      text: \n<HOLČIČKA>Díky!\! Myslím, že tomu rozumím aspoň o něco víc...\! Hehe...

message_32:
      text: \n<HUSTÉ OBOČÍ>Ahoj! Ahoj!\! Jak jsi na tom, JOY?\! <br>Byli ti ti doučující alespoň k něčemu?

message_33:
      text: \n<HUSTÉ OBOČÍ>Á!\! Koukám, že už jsi dodělala ten pracovní list...

message_34:
      text: \n<HUSTÉ OBOČÍ>Skvělá práce!\! Vy byste se tímhle snad mohli živit!\! <br>Tady máte zaplaceno!

message_35:
      text: \n<HUSTÉ OBOČÍ>Přijďte prosím i zítra!

message_36:
      text: \n<HUSTÉ OBOČÍ>Zdravím! Jste tady kvůli mé nabídce o doučování?\! Ne? Ou...

message_37:
      text: \n<HUSTÉ OBOČÍ>JOY by měla být u sebe v pokoji.\! Díky moc za vaší pomoc!

message_1000:
      text: Uff...\! Mluvnice...
